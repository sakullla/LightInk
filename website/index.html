  <style>
    /* 配色与应用内置主题令牌一致（src/theme/tokens.css）：warm-light / dark */
    :root {
      color-scheme: light;
      --bg: #f4efe6;
      --bg-elevated: #fbf7f0;
      --fg: #2f2b24;
      --muted: #6f6758;
      --accent: #9a5828;
      --accent-soft: #efe2cc;
      --border: #d9d0bc;
      --shadow: 0 4px 16px rgba(47, 43, 36, 0.1);
      --shadow-strong: 0 12px 32px rgba(47, 43, 36, 0.14), 0 2px 8px rgba(47, 43, 36, 0.06);
      --font-ui: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB",
        "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #1e1c19;
        --bg-elevated: #282622;
        --fg: #e0d8c8;
        --muted: #9a9180;
        --accent: #d4a066;
        --accent-soft: #3a342a;
        --border: #3f3a32;
        --shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        --shadow-strong: 0 12px 32px rgba(0, 0, 0, 0.45);
      }
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-ui);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 0 24px;
    }

    a { color: var(--accent); }

    /* ---------- 页头 ---------- */
    .site-header {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      border-bottom: 1px solid var(--border);
    }

    .site-header .container {
      display: flex;
      align-items: center;
      gap: 16px;
      min-height: 60px;
    }

    .brand {
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: 0.02em;
      margin-right: auto;
      white-space: nowrap;
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
    }

    .lang-switch button {
      appearance: none;
      border: 0;
      background: transparent;
      color: var(--muted);
      font: inherit;
      font-size: 0.9rem;
      padding: 6px 14px;
      cursor: pointer;
    }

    .lang-switch button[aria-pressed="true"] {
      background: var(--accent-soft);
      color: var(--fg);
      font-weight: 600;
    }

    .header-link {
      font-size: 0.9rem;
      text-decoration: none;
      color: var(--muted);
      white-space: nowrap;
    }

    .header-link:hover { color: var(--accent); }

    /* ---------- Hero ---------- */
    .hero {
      text-align: center;
      padding: 72px 0 56px;
    }

    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(2.2rem, 6vw, 3.4rem);
      letter-spacing: 0.04em;
    }

    .hero .tagline {
      margin: 0 0 18px;
      font-size: clamp(1.05rem, 3vw, 1.3rem);
      color: var(--accent);
      font-weight: 600;
    }

    .hero .desc {
      margin: 0 auto 30px;
      max-width: 720px;
      color: var(--muted);
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 14px;
    }

    .btn {
      display: inline-block;
      padding: 12px 30px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 600;
      border: 1px solid transparent;
    }

    .btn-primary {
      background: var(--accent);
      color: var(--bg-elevated);
      box-shadow: var(--shadow);
    }

    .btn-primary:hover { filter: brightness(1.08); }

    .btn-ghost {
      border-color: var(--border);
      color: var(--fg);
      background: var(--bg-elevated);
    }

    .btn-ghost:hover { border-color: var(--accent); }

    .hero .note {
      margin: 0;
      font-size: 0.88rem;
      color: var(--muted);
    }

    /* ---------- 分节 ---------- */
    section { padding: 48px 0; }

    section h2 {
      margin: 0 0 8px;
      font-size: clamp(1.5rem, 4vw, 2rem);
    }

    .section-desc {
      margin: 0 0 32px;
      color: var(--muted);
      max-width: 720px;
    }

    /* ---------- 平台卡片 ---------- */
    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px 20px 20px;
      box-shadow: var(--shadow);
    }

    .card .os-name {
      margin: 0;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .card .os-desc {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
      flex: 1;
    }

    .card .btn {
      text-align: center;
      padding: 10px 14px;
      font-size: 0.95rem;
    }

    .card.is-current {
      border-color: var(--accent);
      box-shadow: var(--shadow-strong);
    }

    .card .current-badge {
      display: none;
      position: absolute;
      top: -12px;
      right: 14px;
      background: var(--accent);
      color: var(--bg-elevated);
      font-size: 0.75rem;
      font-weight: 600;
      border-radius: 999px;
      padding: 3px 10px;
    }

    .card.is-current .current-badge { display: inline-block; }

    /* ---------- 特性 ---------- */
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .feature {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
    }

    .feature h3 {
      margin: 0 0 8px;
      font-size: 1.05rem;
    }

    .feature p {
      margin: 0;
      font-size: 0.9rem;
      color: var(--muted);
    }

    /* ---------- 截图 ---------- */
    .shots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .shot {
      margin: 0;
    }

    .shot img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: var(--shadow);
      background: var(--bg-elevated);
    }

    .shot figcaption {
      margin-top: 8px;
      font-size: 0.88rem;
      color: var(--muted);
      text-align: center;
    }

    /* ---------- FAQ ---------- */
    .faq {
      max-width: 780px;
    }

    .faq details {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 20px;
      margin-bottom: 12px;
    }

    .faq summary {
      cursor: pointer;
      font-weight: 600;
      padding: 16px 0;
      list-style-position: outside;
    }

    .faq details[open] summary { color: var(--accent); }

    .faq .answer {
      padding: 0 0 18px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .faq .answer code {
      background: var(--accent-soft);
      color: var(--fg);
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.88em;
    }

    /* ---------- 页脚 ---------- */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 28px 0 40px;
      color: var(--muted);
      font-size: 0.88rem;
      text-align: center;
    }

    .site-footer p { margin: 6px 0; }

    /* ---------- 响应式 ---------- */
    @media (max-width: 960px) {
      .cards { grid-template-columns: repeat(2, 1fr); }
      .features { grid-template-columns: repeat(2, 1fr); }
      .shots { grid-template-columns: repeat(2, 1fr); }
    }

    @media (max-width: 620px) {
      .hero { padding: 48px 0 40px; }
      .cards { grid-template-columns: 1fr; }
      .features { grid-template-columns: 1fr; }
      .shots { grid-template-columns: 1fr; }
      .site-header .container { flex-wrap: wrap; padding-top: 8px; padding-bottom: 8px; }
    }
  </style>
</head>

    function readStoredLocale() {
      try {
        var value = window.localStorage.getItem(STORAGE_KEY);
        return value === 'zh-CN' || value === 'en' ? value : null;
      } catch (error) {
        return null; /* file:// 或隐私模式下 localStorage 可能不可用 */
      }
    }

    function storeLocale(locale) {
      try {
        window.localStorage.setItem(STORAGE_KEY, locale);
      } catch (error) {
        /* 记忆失败时本次会话仍生效，只是下次访问回到自动检测 */
      }
    }

    function detectInitialLocale() {
      var stored = readStoredLocale();
      if (stored) return stored;
      var languages = navigator.languages && navigator.languages.length
        ? navigator.languages
        : [navigator.language || ''];
      for (var i = 0; i < languages.length; i += 1) {
        if (/^zh\b/i.test(languages[i])) return 'zh-CN';
      }
      return 'en';
    }

    function applyLocale(locale) {
      var dict = I18N[locale];
      document.documentElement.lang = locale;
      document.title = dict['meta.title'];

      var nodes = document.querySelectorAll('[data-i18n]');
      for (var i = 0; i < nodes.length; i += 1) {
        nodes[i].innerHTML = dict[nodes[i].getAttribute('data-i18n')];
      }

      var attrNodes = document.querySelectorAll('[data-i18n-attr]');
      for (var j = 0; j < attrNodes.length; j += 1) {
        var spec = attrNodes[j].getAttribute('data-i18n-attr').split(':');
        attrNodes[j].setAttribute(spec[0], dict[spec[1]]);
      }

      document.getElementById('lang-zh').setAttribute('aria-pressed', String(locale === 'zh-CN'));
      document.getElementById('lang-en').setAttribute('aria-pressed', String(locale === 'en'));
    }

    /* 访客系统检测：仅用于高亮卡片，与任何下载链接无关（链接统一指向 releases/latest） */
    function detectVisitorOS() {
      var ua = navigator.userAgent;
      if (/Android/i.test(ua)) return 'android';
      if (/Windows|Win64|Win32|IEMobile/i.test(ua)) return 'windows';
      if (/Macintosh|Mac OS X|MacIntel/i.test(ua)) return 'macos';
      if (/CrOS/i.test(ua)) return null; /* ChromeOS 无对应安装包，不高亮 */
      if (/Linux|X11/i.test(ua)) return 'linux';
      return null;
    }

    function highlightCurrentOS() {
      var current = detectVisitorOS();
      if (!current) return;
      var card = document.querySelector('.card[data-os="' + current + '"]');
      if (card) card.classList.add('is-current');
    }

    document.getElementById('lang-zh').addEventListener('click', function () {
      applyLocale('zh-CN');
      storeLocale('zh-CN');
    });

    document.getElementById('lang-en').addEventListener('click', function () {
      applyLocale('en');
      storeLocale('en');
    });

    applyLocale(detectInitialLocale());
    highlightCurrentOS();
  </script>
